      sorting_group_id: "environment"
    on_release:
      - light.turn_on:
          id: onboard_rgb_light
          red: 1.0
          green: 1.0
          blue: 0.0
          brightness: 1.0
      - sensor.duty_time.reset: door_open_time
      # Sync to 1 immediately for our external triggers/monitoring
      - delay: 1s
      - component.update: door_open_time
      - script.execute: report_stats
    on_press:
      - light.turn_off:
          id: onboard_rgb_light
      - component.update: door_open_time # Sync final duration.
      - script.execute: report_stats
      # Allow door_open_time->loop() to process the falling edge (last_state_ = false)
      # before resetting, preventing a non-zero millisecond residual from being published
      # while the door is closed, and spacing out the UDP telemetry packets.
      - delay: 20ms
      - sensor.duty_time.reset: door_open_time
      - script.execute: report_stats

output:
  - platform: ledc
    pin: ${compressor_pwm_pin}
    frequency: 200Hz
    channel: 0
    id: compressor_pwm

  - platform: gpio
    pin: ${compressor_enable_pin}
    id: compressor_enable_output

  - platform: ledc
    pin: ${compressor_fan_pwm_pin}
    frequency: 25kHz
    channel: 2
    id: compressor_cooling_fan_pwm

  - platform: ledc
    pin: ${fridge_fan_pin}
    frequency: 25kHz
    channel: 4
    id: fridge_fan_pwm

fan:
  - platform: speed
    output: compressor_cooling_fan_pwm
    name: "Compressor Cooling Fan"
    id: compressor_cooling_fan
    icon: "mdi:fan"
    web_server:
      sorting_group_id: "command"

  - platform: speed
    output: fridge_fan_pwm
    name: "Fridge Fan"
    id: fridge_fan
    icon: "mdi:fan"
    web_server:
      sorting_group_id: "command"

  - platform: template
    name: "Compressor"
    id: compressor
    icon: "mdi:pump"
    web_server:
      sorting_group_id: "command"
    speed_count: 5
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: compressor_enable_output
      - sensor.duty_time.reset: compressor_on_time
      - component.update: compressor_off_time
      - lambda: |-
          id(compressor_rpm).publish_state((id(compressor).speed - 1) * 500 + 2000);
      - sensor.duty_time.reset: compressor_off_time
    on_turn_off:
      - output.turn_off: compressor_enable_output
      - component.update: compressor_on_time
      - sensor.duty_time.reset: compressor_on_time
      - sensor.duty_time.reset: compressor_off_time
      - lambda: id(compressor_rpm).publish_state(0);
    on_speed_set:
      - lambda: |-
          id(compressor_rpm).publish_state(id(compressor).state ? (id(compressor).speed - 1) * 500 + 2000 : 0);

climate:
  - platform: thermostat
    name: "Fridge"
    id: fridge_thermostat
    sensor: fridge_temp
    icon: "mdi:fridge-bottom"
    web_server:
      sorting_group_id: "temp_targets"

    preset:
      - name: Standard
        default_target_temperature_high: 3.0
        mode: cool
    default_preset: Standard

    # With min allowable setpoint at 2.0°C and emergency freeze protection low cutoff at 1.0°C,
    # setting cool_overrun to 0.5°C ensures cooling stops at 1.5°C at minimum setpoint.
    # This maintains a safe 0.5°C buffer above freeze protection while preventing fan short-cycling.
    cool_overrun: 0.5
    cool_deadband: 0.0

    min_idle_time: 0s
    min_cooling_off_time: 0s
    min_cooling_run_time: 0s

    visual:
      min_temperature: ${math.ceil(fridge_freeze_protection_high)}
      max_temperature: 5
      temperature_step: 0.5

    idle_action:
      then:
        - if:
            condition:
              switch.is_off: manual_override
            then:
              - fan.turn_off: fridge_fan
    cool_action:
      then:
        - script.execute: update_fridge_fan

  - platform: thermostat
    name: "Freezer"
    id: freezer_thermostat
    sensor: freezer_temp
    icon: "mdi:fridge-top"
    web_server:
      sorting_group_id: "temp_targets"

    preset:
      - name: Standard
        default_target_temperature_high: -17.5
        mode: cool
      - name: Deep Freeze
        default_target_temperature_high: -20
        mode: cool
    default_preset: Standard

    cool_overrun: 1.0
    cool_deadband: 0.0

    min_idle_time: 0s
    min_cooling_off_time: ${compressor_anti_short_cycle_s}s
    # Compressor anti-short-cycle protection is enforced in update_compressor.
    # Setting min_cooling_run_time to 0s ensures the thermostat action immediately
    # reflects the OFF state without holding action: cooling for 180s.
    min_cooling_run_time: 0s

    visual:
      min_temperature: -20
      max_temperature: -10
      temperature_step: 0.5

    idle_action: []
    cool_action: []

    on_control:
      # A 10ms delay allows ThermostatClimate::control() to finish committing mode,
      # target_temperature, and action before update_compressor evaluates them.
      - delay: 10ms
      - script.execute: update_compressor

button:
  - platform: template
    name: "Dump Sensor IDs"
    icon: "mdi:chip"
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: "debug"
    on_press:
      - lambda: id(fridge_bus).dump_config();

  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: "host"

light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    channel_colors: GRB
    pin: ${rgb_pin}
    num_leds: 1
    name: "Onboard RGB"
    id: onboard_rgb_light
    icon: "mdi:led-on"
    web_server:
      sorting_group_id: "command"

script:
  - id: update_fridge_fan
    then:
      - lambda: |-
          if (id(manual_override).state) {
            return;
          }
          if (strtoull(id(fridge_temp_address_text).state.c_str(), nullptr, 16) == 0) {
            if (id(fridge_fan).state) {
              id(fridge_fan).turn_off().perform();
            }
            return;
          }
          const float current_temp = id(fridge_temp).state;
          const float setpoint = id(fridge_thermostat).target_temperature;

          // If sensor is NaN, setpoint is NaN, or thermostat is not actively cooling,
          // ensure the fridge circulation fan is turned off.
          // Note: In ESPHome, ThermostatClimate automatically transitions to CLIMATE_ACTION_OFF
          // when current_temperature is NaN. Evaluating this combined check guarantees the fan
          // is safely stopped even when thermostat action has transitioned away from COOLING.
          if (std::isnan(current_temp) || std::isnan(setpoint) ||
              id(fridge_thermostat).action != climate::CLIMATE_ACTION_COOLING) {
            if (id(fridge_fan).state) {
              id(fridge_fan).turn_off().perform();
            }
            return;
          }

          const float error = current_temp - setpoint;
          const float ramp_band = std::max(0.1f, id(fridge_fan_ramp_band_number).state);

          float min_speed = id(fridge_fan_min_speed_number).state;
          float max_speed = id(fridge_fan_max_speed_number).state;
          if (std::isnan(min_speed)) min_speed = 20.0f;
          if (std::isnan(max_speed)) max_speed = 100.0f;

          // Guard against configuration error where min_speed > max_speed.
          // In C++, std::clamp requires lo <= hi; calling std::clamp with inverted
          // bounds triggers undefined behavior.
          if (min_speed > max_speed) {
            std::swap(min_speed, max_speed);
          }

          float speed_pct = min_speed;
          if (error > 0.0f) {
            speed_pct += (error / ramp_band) * (max_speed - min_speed);
          }
          speed_pct = std::clamp(speed_pct, min_speed, max_speed);

          // If calculated target speed is 0% (e.g. min_speed set to 0 and error <= 0),
          // ensure the fan is turned off instead of passing 0% to set_speed(), which
          // ESPHome's FanCall clamps to 1% minimum speed.
          if (speed_pct <= 0.0f) {
            if (id(fridge_fan).state) {
              id(fridge_fan).turn_off().perform();
            }
            return;
          }

          if (!id(fridge_fan).state || std::abs(id(fridge_fan).speed - speed_pct) > 1.0f) {
            ESP_LOGD("update_fridge_fan", "Proportional fan speed: %.1f%% (error: %.2f°C)", speed_pct, error);
            auto call = id(fridge_fan).turn_on();
            call.set_speed(speed_pct);
            call.perform();
          }

  - id: apply_sensor_addresses
    then:
      - lambda: |-
          auto apply_addr = [](dallas_temp::DallasTemperatureSensor *sensor, const std::string &addr_str) {
            uint64_t addr = strtoull(addr_str.c_str(), nullptr, 16);
            sensor->set_address(addr);
            // If the sensor address is cleared or unconfigured (0), DallasTemperatureSensor::update()
            // skips reading and never publishes an update. Publish NAN immediately so stale readings
            // do not persist in state.
            if (addr == 0 && !std::isnan(sensor->state)) {
              sensor->publish_state(NAN);
            }
          };

          apply_addr(id(fridge_temp), id(fridge_temp_address_text).state);
          apply_addr(id(freezer_temp), id(freezer_temp_address_text).state);
          apply_addr(id(compressor_temp), id(compressor_temp_address_text).state);
          apply_addr(id(ambient_temp), id(ambient_temp_address_text).state);

  - id: pet_fridge_watchdog
    mode: restart # Restarting kills the previous delay
    then:
      - delay: 3.5min
      - logger.log:
          tag: fridge_watchdog
          level: ERROR
          format: "Too long since last fridge watchdog pet!"
      - if:
          condition:
            and:
              - switch.is_off: manual_override
              # Do not reboot if sensor address is unconfigured (addr == 0); prevents first-boot reboot loop
              - lambda: 'return strtoull(id(fridge_temp_address_text).state.c_str(), nullptr, 16) != 0;'
          then:
            - button.press: restart_button

  - id: pet_freezer_watchdog
    mode: restart # Restarting kills the previous delay
    then:
      - delay: 3.5min
      - logger.log:
          tag: freezer_watchdog
          level: ERROR
          format: "Too long since last freezer watchdog pet!"
      - if:
          condition:
            and:
              - switch.is_off: manual_override
              # Do not reboot if sensor address is unconfigured (addr == 0); prevents first-boot reboot loop
              - lambda: 'return strtoull(id(freezer_temp_address_text).state.c_str(), nullptr, 16) != 0;'
          then:
            - button.press: restart_button

  - id: update_compressor
    then:
      - lambda: |-
          static uint32_t last_compressor_speed_change = 0;
          static bool defrosting_after_deep_chill = false;
          static bool prev_defrost_mode = false;
          static uint32_t deep_chill_start_ms = 0;
          // Recovery time profiler state: declared at top level so manual override
          // can reset state even when returning early.
          static uint32_t recovery_start_ms = 0;
          static float max_error = NAN;

          // Sliding window state
          static std::vector<float> temp_history;
          static uint32_t last_eval_time = 0;
          const uint32_t kEvalIntervalMs = ${temp_update_interval_s} * 1000;
          const float window_s = id(compressor_window_number).state;
          const size_t history_limit = static_cast<size_t>(window_s / ${temp_update_interval_s}) + 1;
          const uint32_t now = millis();

          static uint8_t consecutive_nan_ticks = 0;

          if(id(manual_override).state) {
            consecutive_nan_ticks = 0;
            temp_history.clear();
            last_eval_time = 0;
            defrosting_after_deep_chill = false;
            prev_defrost_mode = false;
            // Reset recovery time profiler so manual compressor operation does not leave
            // a stale peak error or start timestamp when returning to automatic control.
            recovery_start_ms = 0;
            max_error = NAN;
            ESP_LOGW("update_compressor", "Manual override is on; skipping automatic speed update.");
            if (id(defrost_mode).state) {
              ESP_LOGW("update_compressor", "Manual override is on; disabling defrost.");
              id(defrost_mode).publish_state(false);
            }
            return;
          }

          // Keep compressor idle if freezer sensor address is not yet provisioned.
          // Safely de-energize compressor if it was left running from manual override.
          if (strtoull(id(freezer_temp_address_text).state.c_str(), nullptr, 16) == 0) {
            if (id(compressor).state) {
              ESP_LOGW("update_compressor", "Freezer sensor address unconfigured; shutting down running compressor.");
              id(compressor).turn_off().perform();
            }
            ESP_LOGD("update_compressor", "Freezer sensor address unconfigured; staying idle.");
            return;
          }

          const float current_temp = id(freezer_temp).state;
          if (std::isnan(current_temp)) {
            temp_history.clear();
            last_eval_time = 0;
            if (consecutive_nan_ticks < 255) consecutive_nan_ticks++;
            ESP_LOGW("update_compressor", "Freezer temperature is NaN (consecutive: %u, threshold: 3).", consecutive_nan_ticks);
            // Soft fail-safe: A transient read error (1 or 2 intervals) logs a warning and leaves
            // the compressor at its current state. If freezer_temp is NaN for >= 3 consecutive intervals (45s),
            // immediately shut off compressor and fridge fan to prevent freeze damage or runaway cooling
            // while waiting for the 3.5-minute hardware watchdog to trigger an MCU reboot.
            if (consecutive_nan_ticks >= 3) {
              if (id(compressor).state) {
                ESP_LOGE("update_compressor", "Freezer temperature persistently NaN for %u ticks! Emergency compressor shutoff.", consecutive_nan_ticks);
                id(compressor).turn_off().perform();
              }
              if (id(fridge_fan).state) {
                id(fridge_fan).turn_off().perform();
              }
            }
            return;
          }
          consecutive_nan_ticks = 0;

          const float target_temp = id(defrost_mode).state ? id(defrost_target_temp).state : id(freezer_thermostat).target_temperature;
          const float error = current_temp - target_temp;

          // Guard against stale temperature derivative history after sensor outages, reboots, or delays.
          // If elapsed time exceeds 2x the evaluation interval, clear the window so a massive false
          // derivative rate is not calculated across a wide time gap.
          if (last_eval_time != 0 && (now - last_eval_time > 2 * kEvalIntervalMs)) {
            ESP_LOGW("update_compressor", "Evaluation interval gap (%ums > %ums); clearing stale temp history.",
                     static_cast<unsigned int>(now - last_eval_time), static_cast<unsigned int>(2 * kEvalIntervalMs));
            temp_history.clear();
          }

          // Update evaluation timing
          // Subtract 200ms to allow for minor ESPHome interval jitter
          if (temp_history.empty() || now - last_eval_time >= kEvalIntervalMs - 200) {
            temp_history.push_back(current_temp);
            while (temp_history.size() > history_limit) temp_history.erase(temp_history.begin());
            last_eval_time = now;
            
            // Log the full history state for debugging.
            std::string history_str;
            history_str.reserve(128);
            char h_buf[16];
            for (float t : temp_history) {
              if (!history_str.empty()) history_str += ", ";
              int n = snprintf(h_buf, sizeof(h_buf), "%.2f", t);
              if (n > 0 && n < (int)sizeof(h_buf)) history_str.append(h_buf, n);
            }
            ESP_LOGD("update_compressor", "Temp history: [%s]", history_str.c_str());
          }

          // Temperature delta per hour tracking.
          const float current_delta_per_hour = (temp_history.size() >= history_limit) ? (current_temp - temp_history.front()) * (3600.0f / window_s) : NAN;
          id(freezer_temp_delta_per_hour).publish_state(current_delta_per_hour);

          // On/Off time tracking.
          id(compressor_on_time).update();
          id(compressor_off_time).update();
          if (!id(compressor).state) {
            float off_time = id(compressor_off_time).state;
            if (defrosting_after_deep_chill) {
              // When defrosting, subtract out the forced defrost time from our max tracking.
              off_time -= ${defrost_duration_s};
            }
            id(max_rest_duration_s) = std::max(id(max_rest_duration_s), off_time);
          }

          // Defrost rest period.
          if (id(defrost_mode).state && defrosting_after_deep_chill) {
            if (id(compressor_off_time).state < ${defrost_duration_s}) {
              if (!prev_defrost_mode) {
                ESP_LOGI("defrost", "Defrost mode enabled while compressor off with post-chill rest active (elapsed: %.0fs / %us); resuming rest period.",
                         id(compressor_off_time).state, ${defrost_duration_s});
              }
              prev_defrost_mode = id(defrost_mode).state;
              return;
            }
            if (!prev_defrost_mode) {
              ESP_LOGI("defrost", "Defrost mode enabled, but required post-chill rest was already completed during this off-cycle (off time: %.0fs >= %us); exiting defrost mode.",
                       id(compressor_off_time).state, ${defrost_duration_s});
            } else {
              ESP_LOGI("defrost", "Defrost rest period complete (off time: %.0fs >= %us); exiting defrost mode.",
                       id(compressor_off_time).state, ${defrost_duration_s});
            }
            id(defrost_mode).publish_state(false);
          }
          prev_defrost_mode = id(defrost_mode).state;

          // Freeze protection logic.
          static bool freeze_protection_active = false;
          const bool fridge_configured = (strtoull(id(fridge_temp_address_text).state.c_str(), nullptr, 16) != 0);
          if (fridge_configured && !std::isnan(id(fridge_temp).state)) {
            if (id(fridge_temp).state <= ${fridge_freeze_protection_low}) {
              if (!freeze_protection_active) {
                ESP_LOGW("update_compressor", "Freeze protection ACTIVE (Fridge: %.2f°C <= %.2f°C).", id(fridge_temp).state, ${fridge_freeze_protection_low});
                freeze_protection_active = true;
              }
            } else if (id(fridge_temp).state >= ${fridge_freeze_protection_high}) {
              if (freeze_protection_active) {
                ESP_LOGI("update_compressor", "Freeze protection DEACTIVATED (Fridge: %.2f°C >= %.2f°C).", id(fridge_temp).state, ${fridge_freeze_protection_high});
                freeze_protection_active = false;
              }
            }
          } else {
            // Reset freeze protection if the fridge sensor address is unconfigured or sensor reads NaN.
            // This prevents a latched lockout if an address was cleared or incorrectly mapped during provisioning.
            if (freeze_protection_active) {
              ESP_LOGI("update_compressor", "Freeze protection RESET (fridge sensor unconfigured or NaN).");
              freeze_protection_active = false;
            }
          }

          // Determine next compressor speed.
          const int current_speed = id(compressor).state ? id(compressor).speed : 0;
          auto next_compressor_speed = std::max(current_speed, 1);
          bool emergency_override = false;
          id(p_term) = NAN;
          id(d_term) = NAN;
          id(ff_term) = NAN;

          // Defrost post-chill rest state must persist until the compressor actually restarts.
          // If cleared while the compressor is still off, subsequent intervals will wrongly add the
          // 30-minute forced defrost rest into max_rest_duration_s, falsely skipping the next defrost.
          if (id(compressor).state) {
            defrosting_after_deep_chill = false;
          }

          const bool in_deep_chill = id(defrost_mode).state && !defrosting_after_deep_chill;
          if (in_deep_chill) {
            if (deep_chill_start_ms == 0) {
              deep_chill_start_ms = std::max((uint32_t)1, now);
            }
          } else {
            deep_chill_start_ms = 0;
          }

          if (freeze_protection_active) {
            next_compressor_speed = 0;
            if (in_deep_chill) {
              ESP_LOGI("defrost", "Freeze protection active during deep chill; transitioning to rest period early.");
              defrosting_after_deep_chill = true;
              id(compressor_off_time).reset();
            }
          } else if ((id(freezer_thermostat).mode == climate::CLIMATE_MODE_OFF ||
                      id(freezer_thermostat).action == climate::CLIMATE_ACTION_OFF) &&
                     !id(defrost_mode).state) {
            next_compressor_speed = 0;
          } else if (in_deep_chill) {
            if (current_temp <= target_temp) {
              ESP_LOGI("defrost", "Target temperature reached (%.1f°C); shutting compressor for %us.", target_temp, ${defrost_duration_s});
              next_compressor_speed = 0;
              defrosting_after_deep_chill = true;
              id(compressor_off_time).reset();
            } else if (temp_history.size() >= history_limit && current_delta_per_hour >= ${defrost_thermal_limit_delta} && (now - deep_chill_start_ms) >= (${defrost_thermal_limit_grace_s} * 1000)) {
              ESP_LOGW("defrost", "Thermal limit reached (%.2f°C/h >= %.2f°C/h after %us); aborting deep chill.", current_delta_per_hour, (float)${defrost_thermal_limit_delta}, (unsigned int)((now - deep_chill_start_ms)/1000));
              next_compressor_speed = 0;
              defrosting_after_deep_chill = true;
              id(compressor_off_time).reset();
            } else {
              next_compressor_speed = 5;
              if (current_speed != next_compressor_speed) {
                ESP_LOGI("defrost", "Entering deep chill: forcing compressor to maximum speed.");
              }
            }
          } else if (current_temp >= target_temp + ${compressor_emergency_delta}) {
            // Absolute threshold bypass: jump to max speed
            next_compressor_speed = 5;
            emergency_override = true;
          } else {
            // Simple PD Control
            id(p_term) = error * id(pd_p_multiplier_number).state;
            const float d_multi = (current_delta_per_hour > 0.0f) ? id(pd_d_multiplier_warming_number).state : id(pd_d_multiplier_number).state;
            id(d_term) = current_delta_per_hour * d_multi;

            // Feed forward
            const float fridge_fan_ff = id(fridge_fan).state ? (id(fridge_fan).speed / 100.0f * ${fridge_fan_ff_multiplier}) : 0.0f;
            const float amb_temp = id(ambient_temp).state;
            // Explicitly guard against NaN ambient temperature. While std::max(0.0f, NAN) evaluates to 0.0f
            // under IEEE-754 due to (0.0f < NAN) being false, an explicit check avoids compiler-specific
            // optimization quirks (e.g. -ffast-math) and keeps behavior deterministic if sensor is disconnected.
            const float amb_ff = (!std::isnan(amb_temp))
                ? std::max(0.0f, amb_temp - id(ambient_ff_threshold_number).state) * id(ambient_ff_multiplier_number).state
                : 0.0f;
            id(ff_term) = fridge_fan_ff + amb_ff;

            const float safe_d = std::isnan((float)id(d_term)) ? 0.0f : (float)id(d_term);
            const int desired_speed = round((float)id(p_term) + safe_d + (float)id(ff_term));
            
            // CONTROL ARCHITECTURE (Predictive Turn-On):
            // Compressor turn-on is governed by desired_speed (P + D + FF). If high fridge fan demand
            // (fridge_fan_ff) or a rapid warming trend (d_term) produces desired_speed >= 1, the compressor
            // will start even if current_temp is slightly below target_temp (down to -overrun).
            // This preemptively counteracts heavy thermal loads and arrests temperature spikes at the expense
            // of slightly shorter off-cycles. Note: During early turn-on, freezer_thermostat in the UI will
            // display "Idle" (since error <= 0) while the physical compressor runs.
            // When shutting off, the compressor enforces full hysteresis, running until error <= -overrun.
            const float overrun = id(freezer_thermostat).cool_overrun();
            if (error <= -overrun) {
              next_compressor_speed = 0;
            } else {
              const int min_allowed_speed = id(compressor).state ? 1 : 0;
              next_compressor_speed = std::clamp(desired_speed, min_allowed_speed, 5);
            }
          }

          // Turn off compressor as necessary, tracking max error and recovery time.
          if (next_compressor_speed == 0) {
            // No more cooling! Turn off the compressor.
            if (id(compressor).state) {
              ESP_LOGI("update_compressor", "Compressor OFF | Temp: %.2f°C (Target: %.2f°C) | Delta: %.2f°C/h | Amb: %.2f°C", 
                       current_temp, target_temp, current_delta_per_hour, id(ambient_temp).state);
              id(compressor).turn_off().perform();
            }
            max_error = NAN;
            return;
          }

          // Recovery time profiler: only track recovery during normal cooling cycles.
          // Guard against defrost deep chill and compressor-off periods (anti-short-cycle delay, freeze protection).
          if (id(defrost_mode).state || !id(compressor).state) {
            max_error = NAN;
          } else {
            if (std::isnan(max_error) && error > 0.0f) {
              recovery_start_ms = millis();
              max_error = error;
            }
            max_error = std::max(max_error, error);
            if (current_temp <= target_temp && !std::isnan(max_error)) {
              const float elapsed_hours = (millis() - recovery_start_ms) / 3600000.0f;
              if (elapsed_hours > 0.05f && max_error > 0.5f) {
                id(compressor_recovery_time_measured_sensor).publish_state(elapsed_hours);
                ESP_LOGI("recovery_profiler", "Cooling cycle complete. Took %.2f hours. Max error was %.2f°C.", elapsed_hours, max_error);
              }
              max_error = NAN;
            }
          }

          // Check if the compressor needs an anti-short-cycle delay.
          if (!id(compressor).state && id(compressor_off_time).state < ${compressor_anti_short_cycle_s}) {
            ESP_LOGI("update_compressor", "Anti-short-cycle active (%.0fs left).", ${compressor_anti_short_cycle_s} - id(compressor_off_time).state);
          } else if (!id(compressor).state || current_speed != next_compressor_speed) {
            // Check if the compressor speed change is allowed.
            const uint32_t min_interval_ms = id(compressor_speed_change_interval_number).state * 1000;
            
            bool allow_change = false;
            if (emergency_override) {
              allow_change = true; // Emergency bypasses interval checks
            } else if (!id(compressor).state) {
              allow_change = true; // Still governed by the anti-short-cycle delay above
            } else if (now - last_compressor_speed_change >= min_interval_ms) {
              allow_change = true; // Strict minimum time has passed
            }

            if (!allow_change) {
               ESP_LOGD("update_compressor", "Compressor speed change deferred (last change %us ago, min interval %us).", 
                        static_cast<unsigned int>((now - last_compressor_speed_change) / 1000),
                        static_cast<unsigned int>(min_interval_ms / 1000));
               return;
            }

            // Change the compressor speed.
            last_compressor_speed_change = now;
            if (!std::isnan(current_delta_per_hour)) {
              ESP_LOGI("update_compressor", "Speed change %d to %d | Temp: %.2f°C (Target: %.2f°C) | Delta: %.2f°C/h | Amb: %.2f°C | P: %.2f, D: %.2f, FF: %.2f", 
                       current_speed, next_compressor_speed, 
                       current_temp, target_temp, 
                       current_delta_per_hour,
                       id(ambient_temp).state,
                       (float)id(p_term), (float)id(d_term), (float)id(ff_term));
            } else {
              ESP_LOGI("update_compressor", "Speed change %d to %d | Temp: %.2f°C (Target: %.2f°C) | Emergency: %s | Amb: %.2f°C | P: %.2f, D: %.2f, FF: %.2f", 
                       current_speed, next_compressor_speed, 
                       current_temp, target_temp, emergency_override ? "yes" : "no",
                       id(ambient_temp).state,
                       (float)id(p_term), (float)id(d_term), (float)id(ff_term));
            }
            auto call = id(compressor).turn_on();
            call.set_speed(next_compressor_speed);
            call.perform();
            defrosting_after_deep_chill = false;
          }

  - id: report_stats
    then:
      - influxdb_udp.publish: fridgetroll_stats

influxdb_udp:
  host_text_id: influxdb_host_text
  port_number_id: influxdb_port_number
  tags:
    host: "${name}"
  measurements:
    - measurement: fridgetroll
      id: fridgetroll_stats
      update_interval: never
      fields:
        door_closed: door_closed
        defrost: defrost_mode
        door_open_time: door_open_time
        compressor_on_time:
          sensor: compressor_on_time
          type: uint
        compressor_rpm:
          sensor: compressor_rpm
          type: uint
        uptime:
          sensor: sys_uptime
          type: uint
        ambient_temp: ambient_temp
        compressor_fan_rpm: compressor_fan_rpm
        compressor_temp: compressor_temp
        freezer_target_temp:
          lambda: "return id(freezer_thermostat).target_temperature;"
        freezer_temp: freezer_temp
        freezer_temp_delta: freezer_temp_delta_per_hour
        fridge_fan_speed:
          lambda: "return id(fridge_fan).state ? id(fridge_fan).speed : 0.0f;"
        fridge_target_temp:
          lambda: "return id(fridge_thermostat).target_temperature;"
        fridge_temp: fridge_temp
        p_term: p_term
        d_term: d_term
        ff_term: ff_term
        recovery_time_measured: compressor_recovery_time_measured_sensor
        pd_p_multiplier: pd_p_multiplier_number
        pd_d_multiplier_cooling: pd_d_multiplier_number
        pd_d_multiplier_warming: pd_d_multiplier_warming_number
        ambient_ff_multiplier: ambient_ff_multiplier_number
        recovery_window: compressor_window_number

interval:
  # Update our temperature values in series with a short delay in between.
  # This helps when reading DS18B20 with parasitic power.
  - interval: ${temp_update_interval_s}s
    startup_delay: 1s
    then:
      - component.update: fridge_temp
      - delay: 1s
      - component.update: freezer_temp
      - delay: 1s
      - component.update: ambient_temp
      - delay: 1s
      - component.update: compressor_temp
      - delay: 1s
      - script.execute: update_fridge_fan
      - script.execute: update_compressor
      - script.execute: report_stats
