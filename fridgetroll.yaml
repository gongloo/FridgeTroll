substitutions:
  name: "fridgetroll"
  timezone: "America/New_York"
  temp_update_interval_s: 15
  # Emergency absolute delta (degrees C) above target to trigger max speed
  compressor_emergency_delta: 3.0
  # Multiplier for how much compressor speed to add when the fridge fan is at 100%
  fridge_fan_ff_multiplier: 2.0
  # Anti-short-cycle delay for the compressor.
  compressor_anti_short_cycle_s: 180
  # Duration to keep the compressor off during defrost.
  defrost_duration_s: 1800
  # Rate of cooling (°C/h) above which deep chill aborts due to thermal limit.
  defrost_thermal_limit_delta: "-0.1"
  # Grace period (s) before thermal limit abort is allowed.
  defrost_thermal_limit_grace_s: 1800
  # Fridge freeze protection thresholds.
  fridge_freeze_protection_low: 1.0
  fridge_freeze_protection_high: 1.5

  # Pins for S3 Mini
  one_wire_bus_pin: GPIO11
  compressor_enable_pin: GPIO12
  compressor_pwm_pin: GPIO10
  compressor_fan_speed_pin: GPIO4
  compressor_fan_pwm_pin: GPIO13
  door_pin: GPIO2
  rgb_pin: GPIO47
  fridge_fan_pin: GPIO18

  # Source location of custom external components
  influxdb_udp_component_source: "github://gongloo/esphome-influxdb-udp@v1.1.0"

esphome:
  name: ${name}
  comment: "Smart refrigerator controller providing advanced temperature management, automated defrost, and telemetry"
  project:
    name: "gongloo.${name}"
    version: "0.7.1"
  min_version: 2026.10.0
  on_boot:
    # Priority 700.0 runs after TemplateText restoration (800.0) but before Dallas
    # component setup (600.0). This ensures saved 1-Wire addresses are applied to
    # entities before bus discovery, preventing auto-assignment of a single address to all sensors.
    - priority: 700.0
      then:
        - lambda: |-
            static const char *empty_addrs[] = {nullptr};
            if (!id(syslog_ip_text).state.empty()) {
              static std::string s_syslog_ip = id(syslog_ip_text).state;
              static const char *syslog_addrs[] = {s_syslog_ip.c_str(), nullptr};
              id(syslog_udp)->set_addresses(syslog_addrs);
            } else {
              // Clear address table to prevent fallback broadcast to 255.255.255.255
              id(syslog_udp)->set_addresses(empty_addrs);
            }
            if (id(syslog_port_number).state > 0) {
              id(syslog_udp)->set_broadcast_port(id(syslog_port_number).state);
            }
        - script.execute: apply_sensor_addresses
        - script.execute: pet_fridge_watchdog
        - script.execute: pet_freezer_watchdog
    # Priority 500.0 runs after Dallas component setup (600.0). If exactly one physical sensor is
    # connected on the bus, ESPHome's setup() automatically binds devices[0] to any Dallas component
    # with address_ == 0. Re-running apply_sensor_addresses here resets unconfigured sensors (addr == 0)
    # back to address_ = 0 so they do not inadvertently poll the bus.
    - priority: 500.0
      then:
        - script.execute: apply_sensor_addresses

external_components:
  - source: ${influxdb_udp_component_source}
    id: "influxdb_udp_component"
    components: [influxdb_udp]

esp32:
  board: lolin_s3_mini
  framework:
    type: esp-idf

api:
  reboot_timeout: 0s

improv_serial:

improv_ble:
  authorizer: none

captive_portal:

wifi:
  reboot_timeout: 0s
  ap:
    ssid: "FridgeTroll Fallback"

web_server:
  port: 80
  version: 3
  local: true
  sorting_groups:
    - id: "environment"
      name: "Environment"
      sorting_weight: 10
    - id: "temp_targets"
      name: "Temperature Targets"
      sorting_weight: 15
    - id: "settings"
      name: "Settings"
      sorting_weight: 20
    - id: "compressor_stats"
      name: "Compressor Stats"
      sorting_weight: 30
    - id: "freezer_stats"
      name: "Freezer Stats"
      sorting_weight: 35
    - id: "command"
      name: "Command State"
      sorting_weight: 40
    - id: "sensor_addresses"
      name: "Sensor Addresses"
      sorting_weight: 50
    - id: "udp_settings"
      name: "UDP Configuration"
      sorting_weight: 60
    - id: "debug"
      name: "Debug Tools"
      sorting_weight: 100
    - id: "host"
      name: "Host"
      sorting_weight: 110

logger:
  level: DEBUG

select:
  - platform: logger
    name: "Logger select"
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: "debug"

ota:
  - platform: esphome
    id: esphome_ota

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - lambda: |-
              // Do not run automated defrost if the freezer thermostat is turned OFF by the user.
              if (id(freezer_thermostat).mode == climate::CLIMATE_MODE_OFF) {
                ESP_LOGI("defrost", "Nightly defrost skipped (freezer thermostat is OFF).");
                id(max_rest_duration_s) = 0;
                return;
              }
              if (id(max_rest_duration_s) < ${defrost_duration_s}) {
                ESP_LOGI("defrost", "Nightly defrost triggered (max 24h rest was %.0fs, threshold %us).", id(max_rest_duration_s), ${defrost_duration_s});
                id(defrost_mode).turn_on();
              } else {
                ESP_LOGI("defrost", "Nightly defrost skipped (max 24h rest was %.0fs, threshold %us).", id(max_rest_duration_s), ${defrost_duration_s});
              }
              id(max_rest_duration_s) = 0;

udp:
  - id: syslog_udp

syslog:
  udp_id: syslog_udp
  strip: true # strip color codes
  level: info

one_wire:
  - platform: gpio
    pin: ${one_wire_bus_pin}
    id: fridge_bus

text_sensor:
  - platform: version
    name: "ESPHome"
    web_server:
      sorting_group_id: "host"

sensor:
  - platform: internal_temperature
    name: "ESP"
    id: sys_esp_temperature
    update_interval: 60s
    icon: "mdi:thermometer-lines"
    web_server:
      sorting_group_id: "host"

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: ${temp_update_interval_s}s
    web_server:
      sorting_group_id: "host"

  - platform: wifi_signal
    name: RSSI
    icon: "mdi:wifi"
    id: wifi_signal_db
    update_interval: ${temp_update_interval_s}s
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: "host"

  - platform: template
    name: "Measured Recovery Time"
    id: compressor_recovery_time_measured_sensor
    icon: "mdi:timer-sand"
    unit_of_measurement: "h"
    accuracy_decimals: 2
    update_interval: never
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: "freezer_stats"

  - platform: dallas_temp
    name: "Fridge"
    icon: "mdi:water-thermometer"
    web_server:
      sorting_group_id: "environment"
    id: fridge_temp
    update_interval: never # Updated by interval
    filters:
      - lambda: |-
          if (x == 85.0) {
            ESP_LOGE("fridge_temp", "Sensor (fridge_temp) reported 85°C (power-on reset value), filtering out.");
            return {};
          }
          return x;
    on_value:
      then:
        # Pet watchdog ONLY on valid sensor readings. A disconnected or bus-errored 1-Wire sensor
        # publishes NAN. Petting only on !isnan(x) allows the 3.5-minute hardware watchdog to detect
        # persistent sensor death and trigger an MCU reboot if unresolved.
        - if:
            condition:
              lambda: "return !std::isnan(x);"
            then:
              - script.execute: pet_fridge_watchdog

  - platform: dallas_temp
    name: "Freezer"
    icon: "mdi:snowflake-thermometer"
    web_server:
      sorting_group_id: "environment"
    id: freezer_temp
    update_interval: never # Updated by interval
    filters:
      - lambda: |-
          if (x == 85.0) {
            ESP_LOGE("freezer_temp", "Sensor (freezer_temp) reported 85°C (power-on reset value), filtering out.");
            return {};
          }
          return x;
    on_value:
      then:
        # Pet watchdog ONLY on valid sensor readings. A disconnected or bus-errored 1-Wire sensor
        # publishes NAN. Petting only on !isnan(x) allows the 3.5-minute hardware watchdog to detect
        # persistent sensor death and trigger an MCU reboot if unresolved.
        - if:
            condition:
              lambda: "return !std::isnan(x);"
            then:
              - script.execute: pet_freezer_watchdog

  - platform: pulse_counter
    name: "Compressor Cooling Fan"
    id: "compressor_fan_rpm"
    icon: "mdi:fan"
    web_server:
      sorting_group_id: "compressor_stats"
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    filters:
      - lambda: return x / 2.0;
    update_interval: ${temp_update_interval_s}s
    pin:
      number: ${compressor_fan_speed_pin}
      inverted: true
      mode:
        input: true
        pullup: true

  - platform: duty_time
    id: compressor_on_time
    name: "Compressor On Time"
    icon: "mdi:pump"
    web_server:
      sorting_group_id: "compressor_stats"
    lambda: "return id(compressor).state;"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${temp_update_interval_s}s
    last_time:
      name: "Last Compressor On Time"
      icon: "mdi:pump"
      web_server:
        sorting_group_id: "compressor_stats"
      accuracy_decimals: 0

  - platform: duty_time
    id: compressor_off_time
    name: "Compressor Off Time"
    icon: "mdi:pump-off"
    web_server:
      sorting_group_id: "compressor_stats"
    lambda: "return !id(compressor).state;"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${temp_update_interval_s}s
    last_time:
      name: "Last Compressor Off Time"
      icon: "mdi:pump-off"
      web_server:
        sorting_group_id: "compressor_stats"
      accuracy_decimals: 0

  - platform: template
    name: "Freezer Delta"
    id: freezer_temp_delta_per_hour
    unit_of_measurement: "°C/h"
    accuracy_decimals: 2
    update_interval: never
    icon: "mdi:chart-timeline-variant"
    web_server:
      sorting_group_id: "freezer_stats"

  - platform: duty_time
    id: door_open_time
    internal: true
    lambda: "return !id(door_closed).state;"
    update_interval: ${temp_update_interval_s}s

  - platform: template
    id: compressor_rpm
    internal: True
    update_interval: never # Updated from compressor fan
    on_value:
      - lambda: |-
          if (x < 2000) {
            // De-energize the PC817 optocoupler IR LED when compressor is commanded off.
            // While the SECOP controller requires an active PWM signal during operation
            // to hold variable speed, opening Pin T stops the compressor entirely. Shutting
            // off the 200Hz PWM output eliminates quiescent optocoupler LED power consumption
            // and prevents LED wear/aging while the compressor is idle.
            ESP_LOGD("compressor_rpm", "Compressor off (rpm < 2000), de-energizing PWM output to 0.0.");
            id(compressor_pwm).set_level(0.0f);
            return;
          }
          float ratio = (x - 2000.0) / 2000.0;
          if (ratio < 0) ratio = 0;
          if (ratio > 1) ratio = 1;
          const float duty = (0.87 - (ratio * 0.6));
          ESP_LOGD("compressor_rpm", "Setting compressor PWM output to %f.", duty);
          id(compressor_pwm).set_level(duty);

  - platform: dallas_temp
    name: "Compressor"
    id: compressor_temp
    icon: "mdi:radiator"
    web_server:
      sorting_group_id: "environment"
    update_interval: never # Updated by interval
    filters:
      - lambda: |-
          if (x == 85.0) {
            ESP_LOGE("compressor_temp", "Sensor (compressor_temp) reported 85°C (power-on reset value), filtering out.");
            return {};
          }
          return x;
    on_value:
      then:
        - lambda: |-
            // If manual override is enabled, allow the operator full manual control of the cooling fan.
            if (id(manual_override).state) {
              return;
            }

            constexpr float kHighCompressorTemp = 43.0f;
            constexpr float kMinFanSpeed = 0.0f; // Minimum fan speed %
            constexpr float kMaxFanSpeed = 100.0f; // Maximum fan speed %

            const float comp_temp = x;
            const float amb_temp = id(ambient_temp).state;

            if (std::isnan(comp_temp) || std::isnan(amb_temp)) {
              if (!id(compressor_cooling_fan).state || id(compressor_cooling_fan).speed < 100) {
                auto call = id(compressor_cooling_fan).turn_on();
                call.set_speed(100);
                call.perform();
              }
              return;
            }

            // CRITICAL HARDWARE SAFETY: If the compressor temperature is at or above
            // kHighCompressorTemp, run the cooling fan at 100% unconditionally.
            // Checking this first ensures thermal protection even in high ambient conditions
            // where (comp_temp - amb_temp) might otherwise be smaller than min_delta.
            if (comp_temp >= kHighCompressorTemp) {
              if (!id(compressor_cooling_fan).state || id(compressor_cooling_fan).speed < 100) {
                auto call = id(compressor_cooling_fan).turn_on();
                call.set_speed(100);
                call.perform();
              }
              return;
            }

            const float delta = comp_temp - amb_temp;

            // Fan curve configuration (Delta T from ambient)
            const float min_delta = 5.0f; // Fan starts ramping here
            const float max_delta = std::min(15.0f, kHighCompressorTemp - amb_temp); // Fan at max speed here

            if (delta <= min_delta) {
              if (id(compressor_cooling_fan).state) {
                id(compressor_cooling_fan).turn_off().perform();
              }
              return;
            }

            // Note: Since comp_temp < kHighCompressorTemp (43°C) and delta >= min_delta (5°C),
            // it follows that (kHighCompressorTemp - amb_temp) > (comp_temp - amb_temp) >= 5°C,
            // which mathematically guarantees max_delta > min_delta.
            // We guard denom with std::max(0.1f, ...) as defensive protection against potential future constant tweaks.
            const float denom = std::max(0.1f, max_delta - min_delta);
            const float speed_factor = (delta - min_delta) / denom;
            const float speed_percent = kMinFanSpeed + (kMaxFanSpeed - kMinFanSpeed) * speed_factor;
            const float clamped_speed = std::clamp(speed_percent, kMinFanSpeed, kMaxFanSpeed);

            if (!id(compressor_cooling_fan).state || std::abs(id(compressor_cooling_fan).speed - clamped_speed) > 1.0f) {
              auto call = id(compressor_cooling_fan).turn_on();
              call.set_speed(clamped_speed);
              call.perform();
            }

  - platform: dallas_temp
    name: "Ambient"
    id: ambient_temp
    icon: "mdi:home-thermometer"
    web_server:
      sorting_group_id: "environment"
    update_interval: never # Updated by interval
    filters:
      - lambda: |-
          if (x == 85.0) {
            ESP_LOGE("ambient_temp", "Sensor (ambient_temp) reported 85°C (power-on reset value), filtering out.");
            return {};
          }
          return x;

